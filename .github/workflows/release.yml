name: Build ME+

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            plugin: reaper_ME+.dll
            flags: -A x64
          - platform: linux-x64
            runner: ubuntu-22.04
            plugin: reaper_ME+.so
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            plugin: reaper_ME+.so
          - platform: macos-arm64
            runner: macos-15
            plugin: reaper_ME+.dylib
            flags: -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_OSX_ARCHITECTURES=arm64
          - platform: macos-x64
            runner: macos-15-intel
            plugin: reaper_ME+.dylib
            flags: -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_OSX_ARCHITECTURES=x86_64
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.flags }}
      - run: cmake --build build --config Release --parallel 2
      - run: cmake --install build --config Release --prefix package
      - name: Check Linux exports and dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          plugin='package/${{ matrix.plugin }}'
          symbols=$(nm -D --defined-only "$plugin")
          grep -w ReaperPluginEntry <<< "$symbols"
          grep -w SWELL_dllMain <<< "$symbols"
          dependencies=$(ldd -r "$plugin")
          printf '%s\n' "$dependencies"
          if grep -Eq 'not found|undefined symbol' <<< "$dependencies"; then exit 1; fi
      - name: Check macOS exports and sign
        if: runner.os == 'macOS'
        shell: bash
        run: |
          plugin='package/${{ matrix.plugin }}'
          symbols=$(nm -gU "$plugin")
          grep -w _ReaperPluginEntry <<< "$symbols"
          codesign --force --sign - "$plugin"
          codesign --verify "$plugin"
      - name: Package ME+
        shell: bash
        working-directory: package
        run: cmake -E tar cf '../ME-plus-${{ matrix.platform }}.zip' --format=zip '${{ matrix.plugin }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ME-plus-${{ matrix.platform }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$TAG" release/*.zip --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "ME+ $TAG" --generate-notes
